
name: Keep Render Awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render backend
        run: |
          curl --fail --silent --show-error \
            --max-time 30 \
            "https://merlin-route-finder-api.onrender.com/api/v1/produtos/secoes" \
            -o /dev/null
