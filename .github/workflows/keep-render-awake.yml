
name: Keep Render Awake

on:
  schedule:
    - cron: "3/5 * * * *"
  workflow_dispatch:

concurrency:
  group: keep-render-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake or keep Render awake
        run: |
          for tentativa in 1 2 3; do
            echo "Tentativa $tentativa"

            if curl --fail --silent --show-error \
              --max-time 240 \
              "https://merlin-route-finder-api.onrender.com/api/v1/produtos/secoes" \
              -o /dev/null; then
              echo "Backend respondeu com sucesso."
              exit 0
            fi

            sleep 10
          done

          echo "Backend não respondeu após as tentativas."
          exit 1
