spring:
  application:
    name: merlin-route-finder

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

    # Limites medidos no schema da FIAP (ver D-46): SESSIONS_PER_USER=20, IDLE_TIME=30min,
    # CONNECT_TIME=240min. Os 20 sao POR USUARIO do banco - como o deploy usa a credencial de
    # um integrante, a instancia publicada e a maquina dele dividem a mesma cota.
    hikari:
      # Padrao 3 para desenvolvimento; a instancia publicada define DB_POOL_SIZE=5. Nunca 1:
      # o registro de ruptura roda em REQUIRES_NEW (D-39) e precisa de uma segunda conexao
      # enquanto a transacao de fora ainda segura a primeira.
      maximum-pool-size: ${DB_POOL_SIZE:3}

      # Sem isto o Hikari mantem todas as conexoes vivas e nunca devolve as ociosas, porque o
      # padrao de minimumIdle e igual ao tamanho do pool.
      minimum-idle: 1

      # 25 minutos, com margem antes do IDLE_TIME de 30: recicla a conexao do nosso lado antes
      # que o Oracle a mate do lado dele. O padrao do Hikari sao exatamente 30 minutos, ou
      # seja, empatado com o corte do servidor.
      max-lifetime: 1500000

      # Pool esgotado deve falhar rapido e legivel, nao deixar a tela pensando por meio minuto.
      connection-timeout: 10000

  jpa:
    show-sql: true

    # Desligado explicitamente. A sessao do JPA ficava aberta ate a resposta ser serializada,
    # segurando a conexao com o banco por mais tempo do que o necessario - o que pesa numa
    # instancia pequena com pool limitado. Aqui isso nunca serviu para nada: os adaptadores
    # ja convertem entidade JPA em objeto de dominio dentro da propria transacao, e nenhuma
    # entidade gerenciada chega a camada web. Ver D-45.
    open-in-view: false

    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        # O dialeto NAO e declarado: o Hibernate o descobre pela conexao e escolhe a variante
        # da versao real do banco (Oracle 19), que gera SQL melhor que o dialeto generico.
        format_sql: true
        jdbc:
          # O padrao e 10: o driver busca de dez em dez linhas, e cada busca e uma ida e volta
          # ate o banco. Com a aplicacao publicada nos EUA e o Oracle da FIAP no Brasil, cada
          # ida custa mais de 100ms - uma pagina de 25 produtos pagava tres. 100 cobre a maior
          # pagina que a busca permite (D-45).
          fetch_size: 100

server:
  # Provedores de hospedagem gratuitos injetam a porta em que a aplicacao deve escutar.
  # Sem respeitar PORT, o deploy nao sobe.
  port: ${PORT:8080}

merlin:
  cors:
    # Origens do Totem e do Mobile. Em producao, definir CORS_ALLOWED_ORIGINS com as URLs
    # publicadas, separadas por virgula.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  agendador:
    # Varredura de sessoes com TTL vencido. Nao protege regra de negocio - Sessao.isValida()
    # ja compara com o relogio - apenas mantem o banco condizente com a realidade.
    #
    # Meia hora, e nao cinco minutos: com o TTL em 4 horas (D-24), varrer a cada cinco seriam
    # 48 consultas para cada uma que encontra algo, contra um banco a 5.000 km e num tier
    # gratuito de 0.1 CPU. Ver D-42. Desligavel com merlin.agendador.enabled=false.
    intervalo-ms: ${AGENDADOR_INTERVALO_MS:1800000}
    atraso-inicial-ms: ${AGENDADOR_ATRASO_INICIAL_MS:60000}
  ia:
    base-url: https://generativelanguage.googleapis.com
    # Modelo "lite" escolhido com medicao, nao por ser o mais capaz: responde em ~1s contra
    # mais de 20s do gemini-3.6-flash (que raciocina antes de responder e estourava o tempo
    # limite), e o topo de linha tem cota gratuita de apenas 20 requisicoes por DIA.
    # Ver D-37. gemini-2.5-* estao indisponiveis para chaves novas.
    modelo: ${GEMINI_MODEL:gemini-3.5-flash-lite}
    api-key: ${GEMINI_API_KEY:}

springdoc:
  swagger-ui:
    path: /swagger.html