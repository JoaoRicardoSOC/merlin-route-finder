spring:
  application:
    name: merlin-route-finder

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: true

server:
  # Provedores de hospedagem gratuitos injetam a porta em que a aplicacao deve escutar.
  # Sem respeitar PORT, o deploy nao sobe.
  port: ${PORT:8080}

merlin:
  cors:
    # Origens do Totem e do Mobile. Em producao, definir CORS_ALLOWED_ORIGINS com as URLs
    # publicadas, separadas por virgula.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  jwt:
    # Sem valor configurado, a aplicacao gera uma chave aleatoria no startup e avisa no log.
    # Nunca definir um segredo padrao aqui: ver D-27 em docs/decisoes-tecnicas.md.
    secret: ${JWT_SECRET:}
  handoff:
    # URL base do PWA mobile, codificada no QR Code exibido no Totem.
    base-url: ${HANDOFF_BASE_URL:http://localhost:5173}
  ia:
    base-url: https://generativelanguage.googleapis.com
    # gemini-2.5-flash foi descontinuado para chaves novas; a propria API indica o sucessor.
    modelo: ${GEMINI_MODEL:gemini-3.6-flash}
    api-key: ${GEMINI_API_KEY:}

springdoc:
  swagger-ui:
    path: /swagger.html