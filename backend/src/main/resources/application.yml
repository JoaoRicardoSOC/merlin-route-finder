spring:
  application:
    name: merlin-route-finder

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: true

server:
  # Provedores de hospedagem gratuitos injetam a porta em que a aplicacao deve escutar.
  # Sem respeitar PORT, o deploy nao sobe.
  port: ${PORT:8080}

merlin:
  cors:
    # Origens do Totem e do Mobile. Em producao, definir CORS_ALLOWED_ORIGINS com as URLs
    # publicadas, separadas por virgula.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  jwt:
    # Sem valor configurado, a aplicacao gera uma chave aleatoria no startup e avisa no log.
    # Nunca definir um segredo padrao aqui: ver D-27 em docs/decisoes-tecnicas.md.
    secret: ${JWT_SECRET:}
  handoff:
    # URL base do PWA mobile, codificada no QR Code exibido no Totem.
    base-url: ${HANDOFF_BASE_URL:http://localhost:5173}
  ia:
    base-url: https://generativelanguage.googleapis.com
    # Modelo "lite" escolhido com medicao, nao por ser o mais capaz: responde em ~1s contra
    # mais de 20s do gemini-3.6-flash (que raciocina antes de responder e estourava o tempo
    # limite), e o topo de linha tem cota gratuita de apenas 20 requisicoes por DIA.
    # Ver D-37. gemini-2.5-* estao indisponiveis para chaves novas.
    modelo: ${GEMINI_MODEL:gemini-3.5-flash-lite}
    api-key: ${GEMINI_API_KEY:}

springdoc:
  swagger-ui:
    path: /swagger.html