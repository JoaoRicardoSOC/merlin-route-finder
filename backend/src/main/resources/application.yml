spring:
  application:
    name: merlin-route-finder

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: true

server:
  port: 8080

merlin:
  jwt:
    # Sem valor configurado, a aplicacao gera uma chave aleatoria no startup e avisa no log.
    # Nunca definir um segredo padrao aqui: ver D-27 em docs/decisoes-tecnicas.md.
    secret: ${JWT_SECRET:}
  handoff:
    # URL base do PWA mobile, codificada no QR Code exibido no Totem.
    base-url: ${HANDOFF_BASE_URL:http://localhost:5173}

springdoc:
  swagger-ui:
    path: /swagger.html