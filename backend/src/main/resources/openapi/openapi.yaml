openapi: 3.0.3
info:
  title: Merlin Route Finder API
  description: >
    Contrato da API REST do Merlin Route Finder (FIAP Challenge 2026 / Leroy Merlin).
    Escrito à mão como fonte de verdade API-First (ver docs/planejamento-tecnico.md),
    antes da implementação dos controllers reais. Cobre os recursos das Fases 0 a 3
    do backlog revisado (docs/backlog-trello-revisado.md).
  version: "0.1.0"
servers:
  - url: /api/v1

tags:
  - name: Sessao
    description: Ciclo de vida da sessão do cliente
  - name: Catalogo
    description: Busca e detalhamento de produtos
  - name: Roteiro
    description: Montagem da lista de compras e coleta dos itens
  - name: RupturaEstoque
    description: Tratamento de ruptura física e sugestão de substituto por IA
  - name: Chat
    description: Assistente conversacional (RAG)
  - name: Mapa
    description: Planta da loja para desenhar a tela de mapa

paths:
  /mapa:
    get:
      tags: [Mapa]
      summary: Consultar a planta da loja
      description: |
        Devolve os corredores como retângulos e os pontos que não são prateleira — caixas, banheiro e as placas de QR Code —, todos no grid `0..100`.

        **Não depende de sessão.** O mapa é igual para todo cliente: o que varia entre um e outro (onde ele está, o que ele escolheu) vem das respostas de sessão e de lista. Por isso pode ser buscado uma vez e guardado no aparelho, inclusive para sobreviver a uma queda de conexão dentro da loja.
      responses:
        "200":
          description: Planta da loja
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mapa"
        "500":
          $ref: "#/components/responses/ErroInterno"

  /sessoes:
    post:
      tags: [Sessao]
      summary: Inicializar sessão (UC-001)
      description: |
        Acionado quando o cliente entra pela placa de localização — escaneando o QR Code (que já traz o código na URL) ou digitando o código quando escanear não deu certo.

        Cria uma Sessao ACTIVE com uma ListaRoteiro vazia. O corpo é **opcional**: sem código, ou com um código desconhecido, a sessão nasce sem `posicaoAtual` e continua utilizável.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IniciarSessaoRequest"
      responses:
        "201":
          description: Sessão criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sessao"
        "500":
          $ref: "#/components/responses/ErroInterno"

  /sessoes/{sessaoId}:
    get:
      tags: [Sessao]
      summary: Consultar status/ciclo de vida da sessão
      parameters:
        - $ref: "#/components/parameters/SessaoId"
      responses:
        "200":
          description: Sessão encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sessao"
        "404":
          $ref: "#/components/responses/NaoEncontrado"

  /sessoes/{sessaoId}/posicao:
    put:
      tags: [Sessao]
      summary: Recentrar a posição do cliente
      description: |
        Acionado quando o cliente se perde e lê outra placa da loja.

        Atualiza **apenas** onde ele está: a lista e o que já foi coletado permanecem intactos, e nenhuma sessão nova é criada. A placa informada passa a valer sobre o último item coletado, por ser a evidência mais recente.

        **Código desconhecido devolve 404**, ao contrário de `POST /sessoes` — aqui o cliente já tem sessão funcionando, e avisar que a placa não foi encontrada é acionável. A posição anterior continua valendo.
      parameters:
        - $ref: "#/components/parameters/SessaoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecentrarSessaoRequest"
      responses:
        "200":
          description: Posição atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sessao"
        "400":
          description: Corpo sem o código da placa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "409":
          $ref: "#/components/responses/SessaoInativa"
        "500":
          $ref: "#/components/responses/ErroInterno"

  /sessoes/{sessaoId}/concluir:
    post:
      tags: [Sessao]
      summary: Encerrar a sessão (UC-014)
      description: Acionado quando o cliente finaliza a compra (manualmente ou após coletar todos os itens). Transiciona StatusSessao para COMPLETED.
      parameters:
        - $ref: "#/components/parameters/SessaoId"
      responses:
        "200":
          description: Sessão encerrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sessao"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "409":
          description: Sessão já não está mais ativa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"

  /produtos:
    get:
      tags: [Catalogo]
      summary: Busca e filtragem do catálogo (UC-002)
      description: |
        Sem termo, navega o catálogo em ordem alfabética. Com termo, filtra por nome tolerando busca parcial e pequenos erros de digitação, ordenando por similaridade.

        Os filtros **combinam entre si e com o termo**. Combinação sem resultado devolve **página vazia, não erro** — o cliente filtrou demais, não pediu um recurso inexistente.
      parameters:
        - name: query
          in: query
          required: false
          schema:
            type: string
          description: Termo de busca (tolerante a pequenos erros de digitação)
        - name: secao
          in: query
          required: false
          schema:
            type: string
          description: Corredor da loja, como devolvido por `/produtos/secoes`. Ausente significa todas.
          example: Tintas
        - name: atributo
          in: query
          required: false
          explode: true
          schema:
            type: array
            items:
              type: string
          description: |
            Caracteristica selecionada, no formato `CHAVE:valor` — repetível.

            **Valores da mesma chave são "ou", chaves diferentes são "e".** `atributo=MARCA:Tigre&atributo=MARCA:Docol` traz as duas marcas; acrescentar `atributo=BITOLA:25 mm` restringe às que atendem as duas coisas.

            Chave desconhecida é **ignorada**, não recusada: vem de um link antigo, e o cliente não tem o que fazer a respeito.
          example: MARCA:Tigre
        - name: apenasDisponiveis
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: |
            Esconde os produtos com saldo zerado.

            **O padrão é `false` de propósito:** o catálogo mostra produto sem estoque, porque a ruptura tem tratamento próprio no produto. O filtro serve a quem quer só o que dá para levar hoje.
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Página de resultados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Catalogo"

  /produtos/secoes:
    get:
      tags: [Catalogo]
      summary: Listar as seções do catálogo
      description: |
        O menu de navegação por corredor, com a quantidade de produtos de cada seção.

        **Só aparecem seções que têm produto.** Uma seção vazia seria um beco sem saída no menu. Os nomes são os mesmos `rotulo` dos blocos devolvidos por `/mapa`.
      responses:
        "200":
          description: Seções com produto
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Secao"

  /produtos/{produtoId}:
    get:
      tags: [Catalogo]
      summary: Detalhamento de produto e resolução síncrona de inventário (UC-003)
      parameters:
        - $ref: "#/components/parameters/ProdutoId"
      responses:
        "200":
          description: Produto encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProdutoDetalhado"
        "404":
          $ref: "#/components/responses/NaoEncontrado"

  /produtos/{produtoId}/estoque:
    patch:
      tags: [Catalogo]
      summary: Simular alteração de estoque (ferramenta interna de demonstração)
      description: >
        Não faz parte de nenhum caso de uso do cliente final. Permite zerar ou restaurar o
        saldoEstoque de um produto sob demanda, para disparar o fluxo de ruptura (UC-013)
        de forma confiável durante gravação de vídeo ou apresentação ao vivo.
      parameters:
        - $ref: "#/components/parameters/ProdutoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EstoqueUpdateRequest"
      responses:
        "200":
          description: Estoque atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Produto"
        "404":
          $ref: "#/components/responses/NaoEncontrado"

  /sessoes/{sessaoId}/roteiro:
    get:
      tags: [Roteiro]
      summary: Consultar a lista de compras da sessão (UC-005)
      parameters:
        - $ref: "#/components/parameters/SessaoId"
      responses:
        "200":
          description: Lista de roteiro da sessão
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListaRoteiroResponse"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "409":
          $ref: "#/components/responses/SessaoInativa"

  /sessoes/{sessaoId}/roteiro/itens:
    post:
      tags: [Roteiro]
      summary: Adicionar produto ao roteiro (UC-004)
      description: Sem limite máximo de itens (decisão de negócio de 17/08/2026).
      parameters:
        - $ref: "#/components/parameters/SessaoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdicionarItemRequest"
      responses:
        "201":
          description: Item adicionado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemRoteiroDetalhado"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "409":
          $ref: "#/components/responses/SessaoInativa"

  /sessoes/{sessaoId}/roteiro/itens/{itemId}:
    delete:
      tags: [Roteiro]
      summary: Remover produto da lista (UC-006)
      parameters:
        - $ref: "#/components/parameters/SessaoId"
        - $ref: "#/components/parameters/ItemId"
      responses:
        "204":
          description: Item removido
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "409":
          $ref: "#/components/responses/SessaoInativa"

  /roteiro/itens/{itemId}/coletar:
    patch:
      tags: [Roteiro]
      summary: Marcar item como coletado durante a caminhada (UC-014)
      description: >
        Acionado pelo Mobile quando o cliente confirma ter pego um produto. É o mecanismo
        que faz o "ponto" avançar visualmente na simulação de caminhada do Mobile PWA
        (estratégia de demo da banca final).
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "200":
          description: Item marcado como coletado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemRoteiroDetalhado"
        "404":
          $ref: "#/components/responses/NaoEncontrado"

  /roteiro/itens/{itemId}/desmarcar:
    patch:
      tags: [Roteiro]
      summary: Desfazer a coleta de um item
      description: |
        Acionado quando o cliente tocou por engano — comum num celular, andando — ou devolveu o produto à prateleira.

        **A posição dele volta sozinha** para o item marcado antes deste, ou para a placa lida se não houver nenhum. Não é preciso informar nada: a posição é deduzida do que aconteceu, não gravada.

        Idempotente: desmarcar o que já está desmarcado devolve 200 sem mudar nada.
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "200":
          description: Item desmarcado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemRoteiroDetalhado"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "500":
          $ref: "#/components/responses/ErroInterno"

  /roteiro/itens/{itemId}/substituir:
    post:
      tags: [Roteiro]
      summary: Aceitar o substituto, trocando o item da lista
      description: |
        O produto que faltou **sai** da lista e o substituto **entra**, numa chamada só.

        É o que fecha o ciclo da ruptura: sem isso, aceitar a sugestão exigiria do cliente duas ações — adicionar um produto e remover outro — em pé no corredor, com o celular na mão.

        **O substituto entra NÃO coletado.** Ele nem sempre está na mesma prateleira, e pode estar alguns metros adiante — é o mapa que vai dizer onde. Marcá-lo como coletado faria o cliente sair sem o produto.

        **O registro da ruptura permanece.** Ele é evidência do que aconteceu na gôndola e continua valendo tenha o cliente aceitado a troca ou não — comparar as duas coisas é o que diz à loja se as sugestões estão boas.

        O produto vem no corpo, e não é deduzido da sugestão: o assistente pode responder diferente numa segunda chamada, e a troca precisa valer sobre o que o cliente **viu na tela**. Ele também não está preso à sugestão — se achou outra coisa que resolve, pode trocar por ela.
      parameters:
        - $ref: "#/components/parameters/ItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubstituirItemRequest"
      responses:
        "200":
          description: A lista já com a troca feita
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListaRoteiroResponse"
        "400":
          description: Corpo sem o produto substituto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "409":
          description: Sessão encerrada, ou tentativa de trocar o produto por ele mesmo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"
        "500":
          $ref: "#/components/responses/ErroInterno"

  /roteiro/itens/{itemId}/ruptura:
    post:
      tags: [RupturaEstoque]
      summary: Tratar ruptura de estoque e sugerir substituto (UC-013)
      description: >
        Acionado quando o cliente sinaliza "Prateleira Vazia" no Mobile. Registra a
        ruptura, faz uma pré-filtragem espacial por corredores adjacentes ao PontoMapa
        do produto em falta, e aciona o Gemini via function calling para eleger o
        substituto semântico mais adequado dentre os candidatos já filtrados
        espacialmente (nunca por texto livre do modelo).
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "200":
          description: Substituto sugerido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RupturaEstoqueResponse"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "409":
          $ref: "#/components/responses/SessaoInativa"
        "422":
          description: >
            Ruptura registrada, mas nenhum substituto plausível encontrado nas
            proximidades - seja porque nenhum produto disponível está dentro do raio,
            seja porque o assistente avaliou os candidatos e concluiu que nenhum cumpre
            a mesma função.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardError"

  /sessoes/{sessaoId}/chat/mensagens:
    get:
      tags: [Chat]
      summary: Consultar histórico conversacional da sessão (UC-007 a UC-009)
      parameters:
        - $ref: "#/components/parameters/SessaoId"
      responses:
        "200":
          description: >
            Histórico da conversa em ordem cronológica, possivelmente vazio. Sessão
            encerrada não impede a leitura: o histórico é registro do que já aconteceu.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatMensagem"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
    post:
      tags: [Chat]
      summary: Enviar mensagem ao assistente virtual (UC-007 a UC-009)
      description: >
        O assistente consulta o catálogo real da loja por function calling antes de
        responder, e tem escopo fechado: recusa assuntos fora de reforma, construção,
        bricolagem, decoração e jardinagem. Ele sugere produtos, mas nunca altera o
        roteiro - adicionar continua sendo ação do cliente (UC-004).
      parameters:
        - $ref: "#/components/parameters/SessaoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnviarMensagemRequest"
      responses:
        "201":
          description: >
            Mensagem do assistente. Se o assistente estiver indisponível, a resposta é uma
            mensagem honesta de indisponibilidade, que deliberadamente não entra no
            histórico - a pergunta do cliente fica salva sem resposta, que é o que de fato
            aconteceu.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMensagem"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "409":
          $ref: "#/components/responses/SessaoInativa"

components:
  parameters:
    SessaoId:
      name: sessaoId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProdutoId:
      name: produtoId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    NaoEncontrado:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/StandardError"
    SessaoInativa:
      description: >
        A sessão existe mas não está mais ativa (encerrada, expirada ou abandonada), então a
        operação não é permitida. Diferente do 404: o recurso existe, o estado é que impede.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/StandardError"
    ErroInterno:
      description: Erro interno inesperado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/StandardError"

  schemas:
    StatusSessao:
      type: string
      enum: [ACTIVE, COMPLETED, EXPIRED, ABANDONED]
    AtributoProduto:
      type: string
      description: As características pelas quais um produto pode ser filtrado.
      enum: [MARCA, TIPO, MATERIAL, COR, TEMPERATURA_DE_COR, ACABAMENTO, FORMATO, POTENCIA, AMPERAGEM, POLOS, GRAO, BITOLA, VOLUME, PESO, COMPRIMENTO, LARGURA, DIMENSAO, QUANTIDADE]

    TipoPonto:
      type: string
      enum: [PRATELEIRA, BANHEIRO, CAIXA, QR_CODE]
    Remetente:
      type: string
      enum: [USER, ASSISTANT]

    Sessao:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/StatusSessao"
        criadoEm:
          type: string
          format: date-time
        expiracaoTtl:
          type: string
          format: date-time
        posicaoAtual:
          allOf:
            - $ref: "#/components/schemas/PontoMapa"
          nullable: true
          description: |
            Onde o cliente provavelmente está: a mais recente entre a placa lida e a prateleira do último item coletado.

            Nulo quando não há pista nenhuma — sessão iniciada sem código válido e sem nada coletado ainda.

    PontoMapa:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tipo:
          $ref: "#/components/schemas/TipoPonto"
        corredor:
          type: string
        codigoCurto:
          type: string
          nullable: true
          description: Código digitável do adesivo, na forma canônica (sem hífen). Preenchido apenas em pontos QR_CODE.
          example: TIN02
        coordenadaX:
          type: integer
        coordenadaY:
          type: integer

    Atributo:
      type: object
      description: Uma linha da tabela de especificações do produto.
      properties:
        atributo:
          $ref: "#/components/schemas/AtributoProduto"
        rotulo:
          type: string
          description: Como a característica aparece na tela, para o frontend não manter a tradução.
          example: Bitola
        valor:
          type: string
          example: 25 mm

    Faceta:
      type: object
      description: |
        Um filtro disponível, com os valores presentes **no resultado atual**.

        As facetas são calculadas sobre o recorte de termo, seção e disponibilidade, **ignorando as características já escolhidas** — assim o cliente troca de marca sem precisar limpar o filtro primeiro.
      properties:
        atributo:
          $ref: "#/components/schemas/AtributoProduto"
        rotulo:
          type: string
          example: Marca
        valores:
          type: array
          description: Do valor mais comum para o menos comum.
          items:
            type: object
            properties:
              valor:
                type: string
                example: Tigre
              quantidade:
                type: integer
                example: 2

    Catalogo:
      type: object
      description: Uma página de produtos e os filtros disponíveis para ela. Os dois vêm juntos porque a tela precisa dos dois ao mesmo tempo.
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/Produto"
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
        totalPages:
          type: integer
        facetas:
          type: array
          description: Na ordem de exibição pretendida — marca primeiro, medidas depois.
          items:
            $ref: "#/components/schemas/Faceta"

    Secao:
      type: object
      properties:
        nome:
          type: string
          example: Tintas
        quantidadeProdutos:
          type: integer
          example: 5

    Produto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
        nome:
          type: string
        descricao:
          type: string
          nullable: true
          description: O que o produto é e para que serve. Nulo enquanto ninguém escreveu.
        imagemUrl:
          type: string
          nullable: true
          description: URL pública da foto. **Nula é um estado normal** — a coleta das imagens é incremental, e a tela precisa tratar a ausência.
        preco:
          type: number
          format: double
        saldoEstoque:
          type: integer
        pontoMapaId:
          type: string
          format: uuid

    ProdutoDetalhado:
      allOf:
        - $ref: "#/components/schemas/Produto"
        - type: object
          properties:
            pontoMapa:
              $ref: "#/components/schemas/PontoMapa"
            atributos:
              type: array
              description: As especificações do produto. Só o detalhe as traz — na listagem, carregá-las custaria uma consulta por produto.
              items:
                $ref: "#/components/schemas/Atributo"

    ItemRoteiro:
      type: object
      properties:
        id:
          type: string
          format: uuid
        produtoId:
          type: string
          format: uuid
        coletado:
          type: boolean

    ItemRoteiroDetalhado:
      allOf:
        - $ref: "#/components/schemas/ItemRoteiro"
        - type: object
          properties:
            produto:
              $ref: "#/components/schemas/Produto"

    ListaRoteiroResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sessaoId:
          type: string
          format: uuid
        quantidadeItens:
          type: integer
        itens:
          type: array
          description: Agrupados por seção da loja e, dentro dela, por nome. Não é uma rota — o cliente escolhe o caminho.
          items:
            $ref: "#/components/schemas/ItemRoteiroDetalhado"

    BlocoMapa:
      type: object
      description: Um corredor da loja, como retângulo. `x` e `y` são o canto superior esquerdo.
      properties:
        rotulo:
          type: string
          description: Nome da seção, igual ao `corredor` dos pontos de prateleira.
          example: Tintas
        x:
          type: integer
        y:
          type: integer
        largura:
          type: integer
        altura:
          type: integer

    Mapa:
      type: object
      properties:
        largura:
          type: integer
          description: Lado do grid em que todas as coordenadas do sistema são expressas.
          example: 100
        altura:
          type: integer
          example: 100
        blocos:
          type: array
          items:
            $ref: "#/components/schemas/BlocoMapa"
        pontos:
          type: array
          description: Tudo que não é prateleira, com o tipo para o frontend escolher o que desenhar.
          items:
            $ref: "#/components/schemas/PontoMapa"

    IniciarSessaoRequest:
      type: object
      properties:
        codigoPonto:
          type: string
          nullable: true
          description: Código de localização impresso na placa, em qualquer grafia — `TIN-02`, `tin02` e `TIN 02` são equivalentes.
          example: TIN-02

    RecentrarSessaoRequest:
      type: object
      required: [codigoPonto]
      properties:
        codigoPonto:
          type: string
          description: Código de localização impresso na placa onde o cliente está agora, em qualquer grafia.
          example: CEN-03

    SubstituirItemRequest:
      type: object
      required: [produtoSubstitutoId]
      properties:
        produtoSubstitutoId:
          type: string
          format: uuid
          description: Produto que entra no lugar do que faltou.

    AdicionarItemRequest:
      type: object
      required: [produtoId]
      properties:
        produtoId:
          type: string
          format: uuid

    EstoqueUpdateRequest:
      type: object
      required: [saldoEstoque]
      properties:
        saldoEstoque:
          type: integer
          minimum: 0

    RupturaEstoqueResponse:
      type: object
      properties:
        produtoOriginalId:
          type: string
          format: uuid
        produtoSugeridoId:
          type: string
          format: uuid
        produtoSugerido:
          $ref: "#/components/schemas/ProdutoDetalhado"
        justificativa:
          type: string
          description: Explicação em linguagem natural para a sugestão
        origemSugestao:
          type: string
          description: >
            Quem elegeu o substituto. ASSISTENTE_IA quando o modelo escolheu entre os
            candidatos pré-filtrados; PROXIMIDADE quando o assistente estava indisponível
            e o sistema caiu para o produto disponível mais próximo, sem análise semântica.
            O frontend deve usar este campo para não rotular como recomendação inteligente
            o que foi apenas o item mais perto.
          enum: [ASSISTENTE_IA, PROXIMIDADE]

    ChatMensagem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sessaoId:
          type: string
          format: uuid
        remetente:
          $ref: "#/components/schemas/Remetente"
        conteudo:
          type: string
        enviadoEm:
          type: string
          format: date-time

    EnviarMensagemRequest:
      type: object
      required: [conteudo]
      properties:
        conteudo:
          type: string

    StandardError:
      type: object
      description: Espelha br.com.jence.backend.presentation.response.StandardError
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string
        validationErrors:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/ValidationError"

    ValidationError:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
