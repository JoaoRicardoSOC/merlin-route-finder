<meta charset="utf-8">
<title>Seu traçado, renderizado</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&family=Material+Symbols+Outlined&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#e6e8e3;font-family:'Hanken Grotesk',system-ui,sans-serif;color:#1d1d1b}
  .env{max-width:1240px;margin:0 auto;padding:14px}
  .cartao{background:#fff;border:1px solid #dbe0d7;border-radius:14px;padding:14px;margin-bottom:12px;
          box-shadow:0 4px 16px rgba(29,29,27,.05)}
  h2{font-size:15px;margin:0 0 8px;font-weight:800}
  .barra{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:#414937;margin-bottom:10px;align-items:center}
  .barra label{display:flex;gap:7px;align-items:center;cursor:pointer}
  .fonte{margin-left:auto;font-size:12px;color:#5d6457}
  svg{display:block;width:100%;height:auto}
  #diag{font:11.5px/1.6 ui-monospace,monospace;color:#414937;white-space:pre-wrap}
  .aviso{color:#b3541e;font-weight:700}
  .ok{color:#2e7d0e;font-weight:700}
</style>
<div class="env">
  <div class="cartao">
    <h2>O traçado de Interlagos, renderizado</h2>
    <div class="barra">
      <label><input type="checkbox" id="gond" checked> Gôndolas</label>
      <label><input type="checkbox" id="rot" checked> Rótulos</label>
      <label><input type="checkbox" id="fundoOn"> Planta por baixo</label>
      <label><input type="checkbox" id="vert"> Vértices</label>
      <span class="fonte" id="fonte"></span>
    </div>
    <div style="position:relative">
      <img id="fundo" src="planta-kickoff.png" style="width:100%;display:none;position:absolute;inset:0;opacity:.4">
      <div id="mapa" style="position:relative"></div>
    </div>
  </div>
  <div class="cartao"><h2>Conferência</h2><div id="diag"></div></div>
</div>
<script src="tracado.js"></script>
<script>
/* =========================================================================
   Le o tracado direto do armazenamento do tracador - mesma origem, mesma
   chave. Voce desenha numa aba, recarrega esta, e ve o resultado. Sem copiar,
   colar, nem me esperar no meio.

   As secoes sao POLIGONOS. As gondolas atravessam a caixa envolvente e sao
   RECORTADAS pela forma (clipPath), entao param na parede do departamento em
   vez de vazar - e o que faz o L de Madeiras funcionar.
   ========================================================================= */

/* tipo e padrao de gondola por secao. O tracado traz a forma; isto traz o que
   ela e. Secao desconhecida entra como 'loja' com gondola media. */
const PERFIL = {
  'Tintas':['catalogo','densa'], 'Ferragens':['catalogo','densa'], 'Ferramentas':['catalogo','densa'],
  'Elétrica':['catalogo','densa'], 'Encanamento':['catalogo','densa'], 'Cozinhas':['catalogo','vitrine'],
  'Jardim':['catalogo','media'], 'Iluminação':['catalogo','densa'], 'Decoração':['catalogo','densa'],
  'Materiais de construção':['catalogo','aberta'],
  'Madeiras':['loja','densa'], 'Sanitários':['loja','media'], 'Jardim externo':['loja','aberta'],
  'Organização':['loja','densa'], 'Cerâmica':['loja','media'], 'Pisos laminados':['loja','media'],
  'Tapetes':['loja','media'], 'Ofertas':['loja','media'],
  'Caixas':['servico','caixa'], 'Serviços':['servico','balcao'], 'Entrada':['servico','porta'],
}
const META={
 'Tintas':['format_paint','#0284c7','#e0f2fe'],'Ferragens':['hardware','#64748b','#f1f5f9'],
 'Elétrica':['electrical_services','#c07c08','#fef3c7'],'Encanamento':['plumbing','#0c91cc','#e0f2fe'],
 'Cozinhas':['countertops','#d27306','#fef3c7'],'Iluminação':['lightbulb','#16a34a','#dcfce7'],
 'Jardim':['potted_plant','#15803d','#dcfce7'],'Jardim externo':['deck','#15803d','#dcfce7'],
 'Ferramentas':['handyman','#ea580c','#ffedd5'],'Decoração':['brush','#9333ea','#f3e8ff'],
 'Materiais de construção':['foundation','#b91c1c','#fee2e2'],'Madeiras':['forest','#7c5c34','#f0e9df'],
 'Cerâmica':['grid_view','#6b7280','#f1f2f4'],'Pisos laminados':['layers','#6b7280','#f1f2f4'],
 'Tapetes':['texture','#6b7280','#f1f2f4'],'Sanitários':['wc','#6b7280','#f1f2f4'],
 'Organização':['inventory_2','#6b7280','#f1f2f4'],'Ofertas':['sell','#6b7280','#f1f2f4'],
 'Caixas':['point_of_sale','#00702f','#eaf5e0'],'Serviços':['support_agent','#00702f','#eaf5e0'],
 'Entrada':['door_open','#00702f','#eaf5e0']}
const CORES={catalogo:{f:'#e3f1d4',b:'#5f9c19',t:'#1b3800'},
             loja:{f:'#eceff0',b:'#a3aeb4',t:'#454c51'},
             servico:{f:'#dbeaf6',b:'#3878a3',t:'#0f3550'}}
const PASSO={densa:1.5,media:2.1,vitrine:3.2,aberta:4.0}
const ESP={densa:0.62,media:0.72,vitrine:1.25,aberta:1.15}

/* ---- o traçado: do armazenamento do traçador, ou o embutido ---- */
const CAL = { x0:20, y0:15, ex:0.109, ey:0.107 }
const EMBUTIDO = (window.TRACADO && window.TRACADO.secoes) || []
let fonte = `arquivo (${EMBUTIDO.length} formas)`
let TODAS = EMBUTIDO
try {
  const bruto = JSON.parse(localStorage.getItem('tracado_planta_v2') || '[]')
  if (bruto.length) {
    TODAS = bruto.map(f => [f.nome, f.pontos.map(p => [
      +(2+(p.x-CAL.x0)*CAL.ex).toFixed(1), +(2+(p.y-CAL.y0)*CAL.ey).toFixed(1)])])
    fonte = `traçador (${bruto.length} formas)`
  }
} catch (e) { /* armazenamento indisponivel: segue com a embutida */ }
/* As gondolas tracadas mandam. Onde nao houver tracado, a fileira gerada por
   formula continua entrando - senao o departamento apareceria vazio, o que seria
   pior que generico. Mas o relatorio diz QUAIS ainda sao geradas, para a diferenca
   nunca passar por tracada. */
let GOND = {}
let brutas = (window.TRACADO && window.TRACADO.gondolas || [])
  .map(([dep,a,b,esp]) => ({dep,a,b,esp}))
try {
  const doNavegador = JSON.parse(localStorage.getItem('gondolas_planta_v1') || '[]')
  if (doNavegador.length) brutas = doNavegador      // quem esta desenhando ve o proprio traco
} catch (e) { /* sem armazenamento: fica o arquivo */ }
brutas.forEach(g => (GOND[g.dep] ||= []).push(g))
const nTracadas = Object.values(GOND).reduce((s,v)=>s+v.length,0)
document.getElementById('fonte').textContent =
  `fonte: ${fonte} \u00b7 g\u00f4ndolas ${nTracadas ? nTracadas+' tra\u00e7adas' : 'geradas'}`

/* barra com eixo e espessura -> os quatro cantos, em unidades da grade */
function barra(a, b, esp){
  const dx=b[0]-a[0], dy=b[1]-a[1], L=Math.hypot(dx,dy)||1
  const nx=-dy/L*esp/2, ny=dx/L*esp/2
  return [[a[0]+nx,a[1]+ny],[b[0]+nx,b[1]+ny],[b[0]-nx,b[1]-ny],[a[0]-nx,a[1]-ny]]
}

const CONTORNOS = TODAS.filter(s => s[0].startsWith('Contorno'))
const SECOES = TODAS.filter(s => !s[0].startsWith('Contorno'))

/* ---- geometria ---- */
const caixa = p => ({x0:Math.min(...p.map(a=>a[0])), y0:Math.min(...p.map(a=>a[1])),
                     x1:Math.max(...p.map(a=>a[0])), y1:Math.max(...p.map(a=>a[1]))})
const area = p => { let s=0; for(let i=0;i<p.length;i++){const [x1,y1]=p[i],[x2,y2]=p[(i+1)%p.length]; s+=x1*y2-x2*y1} return Math.abs(s)/2 }
function centroide(p){ let a=0,cx=0,cy=0
  for(let i=0;i<p.length;i++){const [x1,y1]=p[i],[x2,y2]=p[(i+1)%p.length]
    const f=x1*y2-x2*y1; a+=f; cx+=(x1+x2)*f; cy+=(y1+y2)*f}
  a*=0.5; return a===0?p[0]:[cx/(6*a),cy/(6*a)] }
function dentro(p,[x,y]){ let d=false
  for(let i=0,j=p.length-1;i<p.length;j=i++){const [xi,yi]=p[i],[xj,yj]=p[j]
    if((yi>y)!==(yj>y) && x<(xj-xi)*(y-yi)/(yj-yi)+xi) d=!d}
  return d }

const todos = TODAS.flatMap(s=>s[1])
const LIM = { x0:Math.min(...todos.map(p=>p[0]))-3, y0:Math.min(...todos.map(p=>p[1]))-3,
              x1:Math.max(...todos.map(p=>p[0]))+3, y1:Math.max(...todos.map(p=>p[1]))+3 }
const E=10, o=[]
o.push(`<svg viewBox="${LIM.x0*E} ${LIM.y0*E} ${(LIM.x1-LIM.x0)*E} ${(LIM.y1-LIM.y0)*E}">`)
o.push(`<rect x="${LIM.x0*E}" y="${LIM.y0*E}" width="${(LIM.x1-LIM.x0)*E}" height="${(LIM.y1-LIM.y0)*E}" fill="#eceee9"/>`)
o.push('<defs>' + SECOES.map(([r,pts])=>
  `<clipPath id="c${r.replace(/[^a-zA-Z]/g,'')}"><polygon points="${pts.map(p=>`${p[0]*E},${p[1]*E}`).join(' ')}"/></clipPath>`
).join('') + '</defs>')

/* contorno primeiro: e o chao onde tudo assenta */
CONTORNOS.forEach(([r,pts])=>{
  const patio = /pátio|patio/i.test(r)
  o.push(`<polygon points="${pts.map(p=>`${p[0]*E},${p[1]*E}`).join(' ')}"
    fill="${patio?'#faf9f6':'#ffffff'}" stroke="#8d979e" stroke-width="${patio?3:4.5}"
    stroke-linejoin="round" ${patio?'stroke-dasharray="11 7"':''}/>`)
})

const linhas=[]
SECOES.forEach(([r,pts])=>{
  const [tipo,padrao] = PERFIL[r] || ['loja','media']
  const c=CORES[tipo], m=META[r]||['category','#5d6457','#f2f3ef']
  const b=caixa(pts), id='c'+r.replace(/[^a-zA-Z]/g,'')
  o.push(`<polygon points="${pts.map(p=>`${p[0]*E},${p[1]*E}`).join(' ')}"
    fill="${c.f}" stroke="${c.b}" stroke-width="1.6" stroke-linejoin="round"/>`)

  let n=0, gerada=false
  if (GOND[r] && GOND[r].length) {
    GOND[r].forEach(g => { n++
      o.push(`<polygon class="g" points="${barra(g.a,g.b,g.esp).map(p=>`${p[0]*E},${p[1]*E}`).join(' ')}"
        fill="${m[1]}" fill-opacity="0.38" stroke="${m[1]}" stroke-opacity="0.5" stroke-width="0.5"
        clip-path="url(#${id})"/>`) })
  } else if (PASSO[padrao]) {
    gerada=true
    const deitado=(b.x1-b.x0)>=(b.y1-b.y0)
    const passo=PASSO[padrao], esp=ESP[padrao]
    const de=deitado?b.y0:b.x0, ate=deitado?b.y1:b.x1
    for(let p=de+1.1; p<ate-1.1-esp; p+=passo){ n++
      o.push(deitado
        ? `<rect class="g" x="${(b.x0+0.9)*E}" y="${p*E}" width="${(b.x1-b.x0-1.8)*E}" height="${esp*E}" fill="${m[1]}" fill-opacity="0.32" clip-path="url(#${id})"/>`
        : `<rect class="g" x="${p*E}" y="${(b.y0+0.9)*E}" width="${esp*E}" height="${(b.y1-b.y0-1.8)*E}" fill="${m[1]}" fill-opacity="0.32" clip-path="url(#${id})"/>`)
    }
  } else if (padrao==='caixa') {
    gerada=true
    const larg=b.x1-b.x0
    for(let i=0;i<Math.max(3,Math.floor(larg/2.4));i++){ n++
      o.push(`<rect class="g" x="${(b.x0+1+i*2.4)*E}" y="${(b.y0+1)*E}" width="${1.1*E}"
        height="${(b.y1-b.y0-2)*E}" fill="${m[1]}" fill-opacity="0.34" clip-path="url(#${id})"/>`)}
  }

  const [cx,cy]=centroide(pts)
  const larg=Math.min((b.x1-b.x0)*E-4, r.length*6.6+16)
  o.push(`<g class="rot"><rect x="${cx*E-larg/2}" y="${cy*E-9}" width="${larg}" height="18" rx="9"
    fill="#fff" fill-opacity="0.93"/><text x="${cx*E}" y="${cy*E+4}" text-anchor="middle"
    font-size="${r.length>16?9:10.5}" font-weight="700" fill="${c.t}">${r}</text></g>`)
  o.push(`<g class="vt" style="display:none">${pts.map(p=>`<circle cx="${p[0]*E}" cy="${p[1]*E}" r="2.6" fill="#b45309"/>`).join('')}</g>`)

  linhas.push({r,tipo,lados:pts.length,area:+area(pts).toFixed(1),gondolas:n,gerada,
               centroDentro:dentro(pts,[cx,cy])})
})
o.push('</svg>')
document.getElementById('mapa').innerHTML=o.join('\n')

/* ---- conferencia ---- */
/* Encolher antes de comparar. Vizinhos GRUDAM: dividem vertice e aresta de
   proposito, e ponto-em-poligono sobre a borda responde ao acaso do arredondamento.
   Testar as formas cruas acusava 13 invasoes que eram so encosto. Encolhidas 3%
   em direcao ao centroide, borda compartilhada deixa de se tocar e so invasao real
   sobra - somada ao cruzamento de arestas, que pega o caso de duas formas se
   atravessarem sem que vertice nenhum caia dentro da outra. */
const encolher = (p, k=0.03) => { const [cx,cy]=centroide(p)
  return p.map(([x,y])=>[x+(cx-x)*k, y+(cy-y)*k]) }
const cruza = (a,b,c,d) => {
  const s=(p,q,r)=>Math.sign((q[0]-p[0])*(r[1]-p[1])-(q[1]-p[1])*(r[0]-p[0]))
  return s(a,b,c)!==s(a,b,d) && s(c,d,a)!==s(c,d,b) }
const conflitos=[]
for(let i=0;i<SECOES.length;i++) for(let j=i+1;j<SECOES.length;j++){
  const a=encolher(SECOES[i][1]), b=encolher(SECOES[j][1])
  let bate = a.some(p=>dentro(b,p)) || b.some(p=>dentro(a,p))
  if(!bate) for(let x=0;x<a.length&&!bate;x++) for(let y=0;y<b.length&&!bate;y++)
    bate = cruza(a[x],a[(x+1)%a.length],b[y],b[(y+1)%b.length])
  if(bate) conflitos.push(`${SECOES[i][0]} × ${SECOES[j][0]}`)
}
const semCentro=linhas.filter(l=>!l.centroDentro).map(l=>l.r)
let fora=[]
if (CONTORNOS.length){
  /* Departamento encosta na parede de proposito, e vertice EM CIMA da borda faz
     ponto-em-poligono responder ao acaso do arredondamento - o mesmo tropeco do
     teste de sobreposicao. So conta como vazamento o que estiver fora E longe da
     parede; 0,15 da grade e ~24 cm, abaixo da precisao de um clique. */
  const dBorda = (pol,[x,y]) => { let m=Infinity
    for(let i=0;i<pol.length;i++){ const [ax,ay]=pol[i],[bx,by]=pol[(i+1)%pol.length]
      const dx=bx-ax, dy=by-ay, L=dx*dx+dy*dy
      const t = L===0 ? 0 : Math.max(0,Math.min(1,((x-ax)*dx+(y-ay)*dy)/L))
      m = Math.min(m, Math.hypot(x-ax-t*dx, y-ay-t*dy)) }
    return m }
  const solto = p => CONTORNOS.every(c => !dentro(c[1],p) && dBorda(c[1],p) > 0.15)
  fora = SECOES.filter(s=>s[1].some(solto)).map(s=>s[0])
}
const marca = (v,txt) => v.length ? `<span class="aviso">${txt}</span>` : `<span class="ok">nenhuma</span>`
document.getElementById('diag').innerHTML =
 `seções: ${SECOES.length}   ·   contornos: ${CONTORNOS.length}   ·   lados: ${linhas.reduce((s,l)=>s+l.lados,0)}   ·   gôndolas: ${linhas.reduce((s,l)=>s+l.gondolas,0)}\n`+
 `extensão: x ${LIM.x0+3} a ${LIM.x1-3}   ·   y ${LIM.y0+3} a ${LIM.y1-3}\n`+
 `sobreposições: ${marca(conflitos,conflitos.join(', '))}\n`+
 `centroide fora da forma: ${marca(semCentro,semCentro.join(', '))}\n`+
 (CONTORNOS.length ? `seções que vazam o contorno: ${marca(fora,fora.join(', '))}\n`
                   : `<span class="aviso">contorno ainda não traçado — a loja não está delimitada</span>\n`)+
 `\n`+`ainda geradas por fórmula: ${(()=>{const g=linhas.filter(l=>l.gerada).map(l=>l.r)
   return g.length ? `<span class="aviso">${g.length} de ${linhas.length} — ${g.join(', ')}</span>`
                   : `<span class="ok">nenhuma, todas traçadas</span>`})()}\n`
 +linhas.map(l=>`  ${l.r.padEnd(24)} ${String(l.lados).padStart(2)} lados  ${l.tipo.padEnd(9)} área ${String(l.area).padStart(6)}  ${String(l.gondolas).padStart(2)} gôndolas ${l.gerada?'(geradas)':'traçadas'}`).join('\n')

const liga=(id,cls)=>document.getElementById(id).onchange=e=>
  document.querySelectorAll('.'+cls).forEach(n=>n.style.display=e.target.checked?'':'none')
liga('gond','g'); liga('rot','rot'); liga('vert','vt')
document.getElementById('fundoOn').onchange=e=>{
  document.getElementById('fundo').style.display=e.target.checked?'block':'none'
  document.querySelectorAll('#mapa polygon').forEach(n=>n.setAttribute('fill-opacity',e.target.checked?0.4:1))
}
</script>
