<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leroy Merlin - Assistente Digital & Localizador</title>
    
    <meta name="description" content="Encontre produtos na loja Leroy Merlin, monte seu roteiro de compras e siga a rota pelos corredores. Escaneie a placa do corredor para o app saber onde voce esta." />

    <!--
      Google Fonts e Material Symbols numa REQUISICAO SO.
      Eram duas folhas, as duas bloqueando a primeira pintura. O Lighthouse mediu 871 ms na
      primeira e 172 ms na segunda, num total de cerca de 7 s de bloqueio estimado no perfil
      de celular. Juntar nao resolve o problema de raiz - sao quatro familias tipograficas,
      e isso e decisao de desenho (O-37) -, mas tira uma ida e volta do caminho critico sem
      mudar nada na tela.
    -->
    <!--
      As fontes moram no projeto, em /fontes. Antes vinham do Google, e aquela folha
      era uma requisicao BLOQUEANTE para um dominio de terceiros: o navegador so
      descobria a URL da fonte depois de baixar o CSS de la, o que somava uma viagem
      de ida e volta inteira antes da primeira pintura. Ver O-37.

      O preload existe porque o CSS do app tambem e bloqueante: sem ele, a fonte so
      seria descoberta depois que o navegador terminasse de ler a folha de estilo.
      Com ele, o download comeca junto.
    -->
    <link rel="preload" href="/fontes/hanken-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fontes/material-symbols.woff2" as="font" type="font/woff2" crossorigin>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
